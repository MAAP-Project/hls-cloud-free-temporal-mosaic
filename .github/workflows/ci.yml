name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.*"
          enable-cache: false
      - name: Validate code, CWL, and offline tests
        run: |
          set -euo pipefail
          uv run --frozen --group dev pre-commit run --all-files
          uvx --from cwltool cwltool --validate hls-cloud-free-temporal-mosaic.cwl
          uvx --with pyyaml --from ogc-ap-validator ap-validator --detail errors hls-cloud-free-temporal-mosaic.cwl
          uv run --frozen --group dev pytest

  container:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test image
        run: |
          set -euo pipefail
          image=hls-cloud-free-temporal-mosaic
          docker build --tag "$image" .
          docker run --rm "$image" \
            /app/hls-cloud-free-temporal-mosaic/.venv/bin/python \
            /app/hls-cloud-free-temporal-mosaic/main.py --help

  publish-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish latest image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image" .
          docker push "$image"
