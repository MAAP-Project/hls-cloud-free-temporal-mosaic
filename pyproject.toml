[project]
name = "hls-cloud-free-temporal-mosaic"
description = "Generate cloud-free temporal mosaics from HLS data"
readme = "README.md"
version = "0.3.3"
requires-python = ">=3.12"

dependencies = [
    "affine>=2.4.0",
    "dask>=2025.10.0",
    "lazycogs>=0.5.0",
    "maap-py>=4.2.0",
    "obstore>=0.9.5",
    "pyproj>=3.7.2",
    "pystac>=1.14.1",
    "rio-stac>=0.10.1",
    "rioxarray>=0.20.0",
    "rustac[duckdb-extensions]>=0.9.11",
    "shapely>=2.1.2",
    "xarray>=2026.4.0",
]

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14.3",
]

[tool.ruff]

[tool.ruff.format]
